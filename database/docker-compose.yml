# 실행: 루트에서  docker compose --env-file .env -f database/docker-compose.yml up -d
# 값은 루트 .env 에서만 읽는다(기본값 없음 — 누락 시 즉시 실패).
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: roadfm-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - roadfm-db:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  roadfm-db:
