<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>ROADFM · Pleos Connect UX Design Guide 적용 시연</title>
        <meta
            name="description"
            content="ROADFM 사용자 세팅·사용 흐름 자동 재생 시연 (UX Simulation)"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
        />
        <style>
            :root {
                --k: 1;
                --base: #111312;
                --surface: #1a1c1b;
                --surface2: #202321;
                --line: #2a2d2b;
                --ink: #e4e7e4;
                --muted: #9a9f9b;
                --dim: #737a75;
                --teal: #a3c585;
                --amber: #e2a85f;
                --navi: #1d2a3a;
                --navi2: #16212e;
                --naviAccent: #4aa3ff;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: #070807;
                color: var(--ink);
                font-family:
                    "Pretendard Variable", Pretendard, "Apple SD Gothic Neo",
                    "Malgun Gothic", sans-serif;
                -webkit-font-smoothing: antialiased;
                overflow: hidden;
            }
            button {
                font: inherit;
                color: inherit;
                cursor: pointer;
            }
            .wrap {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 1280px;
                height: 880px;
                transform: translate(-50%, -50%) scale(var(--k));
                transform-origin: 50% 50%;
            }
            /* stage = 차량 화면 */
            .stage {
                position: relative;
                width: 1280px;
                height: 720px;
                border-radius: 26px;
                border: 9px solid #050605;
                background: var(--base);
                overflow: hidden;
                box-shadow: 0 20px 60px #0008;
            }
            .scene {
                position: absolute;
                inset: 0;
                opacity: 0;
                transition: opacity 0.45s;
            }
            .scene.on {
                opacity: 1;
            }
            .still .scene {
                transition: none;
            }
            /* caption */
            .cap {
                height: 160px;
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 22px;
                align-items: center;
                padding: 18px 10px 0;
            }
            .cap-tag {
                display: flex;
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
                min-width: 150px;
            }
            .tag {
                font-size: 15px;
                font-weight: 800;
                padding: 6px 14px;
                border-radius: 20px;
                background: #a3c585;
                color: #111312;
                white-space: nowrap;
            }
            .tag.auto {
                background: #8fb3d9;
            }
            .tag.drive {
                background: var(--amber);
            }
            .tag.once {
                background: #c9b6e8;
            }
            .tag.rest {
                background: #a3c585;
            }
            .stepno {
                font-size: 12px;
                color: var(--dim);
                font-variant-numeric: tabular-nums;
            }
            .cap-text h2 {
                margin: 0 0 6px;
                font-size: 25px;
                letter-spacing: -0.03em;
            }
            .cap-text p {
                margin: 0;
                font-size: 16px;
                color: #c8cdc9;
                line-height: 1.6;
            }
            .bar {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: 4px;
                background: #1a1c1b;
            }
            .bar i {
                display: block;
                height: 100%;
                width: 0;
                background: var(--teal);
            }
            .ctrl {
                position: fixed;
                right: 14px;
                bottom: 12px;
                display: flex;
                gap: 6px;
                z-index: 10;
                opacity: 0.25;
                transition: opacity 0.2s;
            }
            .ctrl:hover {
                opacity: 1;
            }
            .ctrl button {
                background: #1a1c1b;
                border: 1px solid var(--line);
                border-radius: 16px;
                padding: 6px 12px;
                font-size: 12px;
                color: var(--muted);
            }
            .sim {
                position: absolute;
                bottom: 10px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 5;
                font-size: 11px;
                color: #c8cdc9;
                background: #000a;
                border: 1px solid #333;
                border-radius: 12px;
                padding: 4px 10px;
                letter-spacing: 0.04em;
            }
            .gear {
                position: absolute;
                top: 12px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 5;
                font-size: 13px;
                font-weight: 800;
                border-radius: 12px;
                padding: 4px 12px;
            }
            .gear.p {
                background: #a3c585;
                color: #111312;
            }
            .gear.d {
                background: var(--amber);
                color: #111312;
            }

            /* ===== 공통 UI ===== */
            .svg {
                width: 20px;
                height: 20px;
                stroke: currentColor;
                fill: none;
                stroke-width: 1.8;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .tap {
                position: absolute;
                width: 64px;
                height: 64px;
                margin: -32px 0 0 -32px;
                border-radius: 50%;
                border: 3px solid #fff;
                box-shadow: 0 0 0 6px #ffffff33;
                animation: tap 1.2s ease-out infinite;
                z-index: 6;
                pointer-events: none;
            }
            @keyframes tap {
                0% {
                    transform: scale(0.6);
                    opacity: 1;
                }
                100% {
                    transform: scale(1.4);
                    opacity: 0;
                }
            }
            .bubble {
                position: absolute;
                z-index: 6;
                background: #fff;
                color: #111;
                border-radius: 18px;
                padding: 12px 18px;
                font-size: 18px;
                font-weight: 700;
                box-shadow: 0 10px 30px #0007;
                display: flex;
                gap: 10px;
                align-items: center;
                animation: pop 0.35s ease-out;
                border: 1px solid rgba(0, 0, 0, 0.08);
            }
            .bubble::after {
                content: "";
                position: absolute;
                left: 22px;
                bottom: -9px;
                width: 18px;
                height: 18px;
                background: inherit;
                border-left: inherit;
                border-bottom: inherit;
                transform: rotate(-45deg);
                border-bottom-left-radius: 4px;
            }
            .bubble.bnavi {
                background: #1e6fd9;
                color: #fff;
                border-color: #7fb0f0;
            }
            .bubble.sys {
                background: #2a2d2b;
                color: #e4e7e4;
                border: 1px solid #484d49;
            }
            @keyframes pop {
                from {
                    transform: translateY(8px) scale(0.96);
                    opacity: 0;
                }
                to {
                    transform: none;
                    opacity: 1;
                }
            }
            .wheel {
                position: absolute;
                z-index: 6;
                left: 40px;
                bottom: 40px;
                display: flex;
                align-items: center;
                gap: 12px;
                background: #000c;
                border: 1px solid #444;
                border-radius: 40px;
                padding: 10px 18px 10px 10px;
                font-size: 16px;
                font-weight: 700;
                animation: pop 0.35s;
            }
            .wheel b {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                background: #2a2d2b;
                border: 2px solid #777;
                display: grid;
                place-items: center;
                font-size: 18px;
            }
            .toast {
                position: absolute;
                z-index: 6;
                right: 28px;
                bottom: 28px;
                background: linear-gradient(180deg, #233224, #1b2420);
                border: 1px solid #6f8a63;
                border-radius: 16px;
                padding: 14px 18px;
                font-size: 15px;
                display: flex;
                gap: 10px;
                align-items: center;
                animation: pop 0.35s;
                box-shadow: 0 10px 26px #0006;
                color: #eef4ea;
                max-width: 440px;
                line-height: 1.45;
            }
            .toast::after {
                content: "";
                position: absolute;
                right: 26px;
                bottom: -9px;
                width: 18px;
                height: 18px;
                background: #1b2420;
                border-right: 1px solid #6f8a63;
                border-bottom: 1px solid #6f8a63;
                transform: rotate(45deg);
                border-bottom-right-radius: 4px;
            }

            /* ===== ROADFM 앱 셸 ===== */
            .app {
                position: absolute;
                inset: 0;
                display: flex;
            }
            .side {
                width: 88px;
                background: #0b0c0b;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 20px 0;
                gap: 16px;
            }
            .logo {
                width: 42px;
                height: 42px;
                border-radius: 13px;
                background: var(--teal);
                color: #111;
                display: grid;
                place-items: center;
                margin-bottom: 22px;
            }
            .nav {
                font-size: 11px;
                color: var(--muted);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                padding: 10px 6px;
                border-radius: 12px;
                width: 70px;
            }
            .nav.on {
                background: #202321;
                color: #fff;
            }
            .main {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-width: 0;
            }
            .top {
                height: 58px;
                border-bottom: 1px solid var(--line);
                background: var(--surface);
                display: flex;
                align-items: center;
                padding: 0 28px;
                justify-content: space-between;
            }
            .word {
                font-weight: 800;
                letter-spacing: 0.12em;
                font-size: 21px;
            }
            .word i {
                color: var(--teal);
                font-style: normal;
            }
            .clock {
                font-weight: 700;
                font-size: 18px;
                font-variant-numeric: tabular-nums;
            }
            .page {
                flex: 1;
                padding: 26px 30px;
                display: flex;
                flex-direction: column;
                gap: 16px;
                min-height: 0;
            }
            .h1 {
                font-size: 30px;
                font-weight: 700;
                letter-spacing: -0.04em;
                margin: 0;
            }
            .sub {
                font-size: 14px;
                color: var(--muted);
                margin: 0;
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 16px;
                padding: 18px 20px;
            }
            .choice {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: var(--surface2);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 20px 22px;
                font-size: 20px;
                font-weight: 700;
            }
            .choice.on {
                border-color: var(--teal);
                background: #243024;
            }
            .choice .ck {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: 2px solid #555;
                display: grid;
                place-items: center;
                font-size: 14px;
            }
            .choice.on .ck {
                background: var(--teal);
                border-color: var(--teal);
                color: #111;
            }
            .btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                border: 0;
                border-radius: 12px;
                padding: 14px 22px;
                font-weight: 800;
                font-size: 16px;
                background: var(--teal);
                color: #111;
            }
            .btn.sec {
                background: var(--surface2);
                color: var(--ink);
                border: 1px solid var(--line);
            }
            .row {
                display: flex;
                align-items: center;
                gap: 14px;
                border-top: 1px solid var(--line);
                padding: 12px 0;
            }
            .row:first-child {
                border-top: 0;
            }
            .row .t {
                flex: 1;
            }
            .row .t b {
                display: block;
                font-size: 16px;
            }
            .row .t small {
                font-size: 12px;
                color: var(--muted);
            }
            .num {
                width: 34px;
                height: 34px;
                border-radius: 10px;
                background: #242725;
                color: var(--teal);
                display: grid;
                place-items: center;
                font-weight: 800;
                font-size: 13px;
            }
            .pill {
                font-size: 12px;
                font-weight: 700;
                border: 1px solid var(--line);
                background: #202321;
                border-radius: 16px;
                padding: 6px 11px;
                white-space: nowrap;
                color: #c8cdc9;
            }
            .pill.on {
                background: var(--teal);
                border-color: var(--teal);
                color: #111;
            }
            .toggle {
                width: 52px;
                height: 30px;
                border-radius: 16px;
                background: #3a3e3b;
                position: relative;
                flex: none;
            }
            .toggle:after {
                content: "";
                position: absolute;
                top: 4px;
                left: 4px;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                background: #bbb;
                transition: 0.3s;
            }
            .toggle.on {
                background: var(--teal);
            }
            .toggle.on:after {
                left: 26px;
                background: #111;
            }
            .grid2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                flex: 1;
                min-height: 0;
            }
            .navicard {
                display: flex;
                align-items: center;
                gap: 14px;
                background: #202321;
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 14px 16px;
            }
            .navicard .ic {
                width: 42px;
                height: 42px;
                border-radius: 12px;
                background: var(--teal);
                color: #111;
                display: grid;
                place-items: center;
            }
            .navicard b {
                font-size: 20px;
                display: block;
            }
            .navicard small {
                font-size: 11px;
                color: var(--muted);
            }
            .badge {
                font-size: 11px;
                font-weight: 800;
                background: var(--teal);
                color: #111;
                border-radius: 10px;
                padding: 3px 9px;
                white-space: nowrap;
            }
            .suggest {
                border: 1px dashed #5d7a4a;
                background: #18201a;
                border-radius: 14px;
                padding: 14px 16px;
                display: flex;
                align-items: center;
                gap: 14px;
            }
            .suggest .t b {
                font-size: 15px;
            }
            .suggest .t small {
                font-size: 12px;
                color: #b9c9ad;
            }

            /* ===== 현대차 내비 (자리표시) ===== */
            .navi {
                position: absolute;
                inset: 0;
                background: radial-gradient(
                    1200px 600px at 60% 70%,
                    #22344a,
                    #141d28
                );
                overflow: hidden;
            }
            .navi .grid {
                position: absolute;
                inset: 0;
                background-image:
                    linear-gradient(#ffffff08 1px, transparent 1px),
                    linear-gradient(90deg, #ffffff08 1px, transparent 1px);
                background-size: 64px 64px;
            }
            .navi .road {
                position: absolute;
                inset: 0;
            }
            .navi-label {
                position: absolute;
                left: 50%;
                top: 46%;
                transform: translate(-50%, -50%);
                text-align: center;
                color: #9fb6cf;
                opacity: 0.55;
                font-size: 15px;
                letter-spacing: 0.06em;
            }
            .navi-label b {
                display: block;
                font-size: 30px;
                letter-spacing: 0.02em;
                color: #c8d8ea;
                margin-bottom: 6px;
            }
            .tbt {
                position: absolute;
                left: 24px;
                top: 56px;
                background: #0e1620ee;
                border: 1px solid #2c3f55;
                border-radius: 16px;
                padding: 16px 20px;
                display: flex;
                gap: 16px;
                align-items: center;
                min-width: 330px;
            }
            .tbt .arrow {
                width: 56px;
                height: 56px;
                border-radius: 12px;
                background: #1e6fd9;
                display: grid;
                place-items: center;
                font-size: 30px;
                font-weight: 900;
            }
            .tbt b {
                font-size: 28px;
                display: block;
            }
            .tbt span {
                font-size: 14px;
                color: #9fb6cf;
            }
            .eta {
                position: absolute;
                left: 24px;
                bottom: 22px;
                background: #0e1620ee;
                border: 1px solid #2c3f55;
                border-radius: 14px;
                padding: 12px 18px;
                display: flex;
                gap: 22px;
                font-size: 15px;
                color: #c8d8ea;
            }
            .eta b {
                font-size: 20px;
                color: #fff;
            }
            .navi-brand {
                position: absolute;
                left: 24px;
                top: 16px;
                font-size: 12px;
                color: #9fb6cf;
                letter-spacing: 0.05em;
            }
            .navi-search {
                position: absolute;
                inset: 0;
                background: #141d28;
                display: flex;
                flex-direction: column;
                padding: 56px 40px 30px;
                gap: 16px;
            }
            .navi-input {
                background: #0e1620;
                border: 2px solid #1e6fd9;
                border-radius: 14px;
                padding: 16px 20px;
                font-size: 24px;
                font-weight: 700;
                display: flex;
                gap: 12px;
                align-items: center;
            }
            .navi-input .cur {
                width: 2px;
                height: 28px;
                background: #4aa3ff;
                animation: none;
            }
            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }
            .navi-res {
                background: #0e1620;
                border: 1px solid #2c3f55;
                border-radius: 14px;
            }
            .navi-res div {
                padding: 16px 20px;
                border-top: 1px solid #2c3f55;
                font-size: 18px;
            }
            .navi-res div:first-child {
                border-top: 0;
            }
            .navi-res small {
                display: block;
                font-size: 13px;
                color: #9fb6cf;
                margin-top: 2px;
            }
            .navi-go {
                align-self: flex-end;
                background: #1e6fd9;
                color: #fff;
                border: 0;
                border-radius: 14px;
                padding: 16px 34px;
                font-size: 20px;
                font-weight: 800;
            }
            /* ROADFM 미니 카드 (시스템 미디어 영역) */
            .mini {
                position: absolute;
                right: 22px;
                bottom: 22px;
                width: 400px;
                background: #111312f2;
                border: 1px solid #3a3e3b;
                border-radius: 18px;
                padding: 14px;
                display: grid;
                grid-template-columns: 76px 1fr;
                gap: 14px;
                align-items: center;
                box-shadow: 0 12px 40px #0009;
            }
            .mini .art {
                width: 76px;
                height: 76px;
                border-radius: 12px;
                background: linear-gradient(135deg, #3d5a45, #1f2d24);
                display: flex;
                align-items: flex-end;
                padding: 7px;
                font-size: 13px;
                font-weight: 800;
            }
            .mini .art.coffee {
                background: linear-gradient(135deg, #5a4636, #2a211a);
            }
            .mini small {
                font-size: 11px;
                color: var(--teal);
                font-weight: 700;
            }
            .mini b {
                display: block;
                font-size: 17px;
                margin: 3px 0 6px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .mini .pb {
                height: 4px;
                background: #2a2d2b;
                border-radius: 3px;
                overflow: hidden;
            }
            .mini .pb i {
                display: block;
                height: 100%;
                background: var(--teal);
            }
            .mini .ctl {
                display: flex;
                gap: 10px;
                margin-top: 9px;
                align-items: center;
            }
            .mini .ctl span {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                background: #202321;
                display: grid;
                place-items: center;
                font-size: 13px;
            }
            .mini .ctl span.pp {
                background: var(--teal);
                color: #111;
                width: 38px;
                height: 38px;
            }
            .mini .ctl em {
                font-style: normal;
                font-size: 11px;
                color: var(--muted);
                margin-left: auto;
            }
            .mini-label {
                position: absolute;
                right: 22px;
                bottom: 150px;
                font-size: 11px;
                color: #c8cdc9;
                background: #000a;
                border-radius: 8px;
                padding: 3px 8px;
            }
            .reco {
                position: absolute;
                right: 22px;
                bottom: 150px;
                width: 400px;
                background: #1a1c1bf5;
                border: 1px solid #5d7a4a;
                border-radius: 16px;
                padding: 14px 16px;
                font-size: 15px;
                line-height: 1.55;
                animation: pop 0.35s;
                z-index: 4;
            }
            .reco small {
                display: block;
                color: var(--teal);
                font-weight: 800;
                font-size: 12px;
                margin-bottom: 4px;
            }
            .locked {
                position: absolute;
                inset: 0;
                background: #000b;
                display: grid;
                place-items: center;
                z-index: 5;
                animation: pop 0.3s;
            }
            .locked div {
                background: #1a1c1b;
                border: 1px solid #3a3e3b;
                border-radius: 18px;
                padding: 26px 32px;
                text-align: center;
                font-size: 18px;
                font-weight: 700;
            }
            .locked small {
                display: block;
                font-size: 14px;
                color: var(--muted);
                font-weight: 500;
                margin-top: 8px;
            }
            /* 타이틀/요약 */
            .title {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 0 110px;
                background: radial-gradient(
                    900px 500px at 75% 30%,
                    #243024,
                    #111312
                );
            }
            .title .k {
                font-size: 15px;
                letter-spacing: 0.2em;
                color: var(--teal);
                font-weight: 800;
            }
            .title h1 {
                font-size: 64px;
                letter-spacing: -0.04em;
                margin: 14px 0 18px;
                line-height: 1.15;
            }
            .title p {

nbBtn("car", "차량 설정", "car-icon")}${gnbBtn("chevL", "감소", "chev")}<div class="temp">${sysIcon("fan")}<span class="value"><span class="deg">20<i>.0</i></span><small>${sysIcon("snow")}AUTO</small></span></div>${gnbBtn("chevR", "증가", "chev")}${gnbBtn("defrost", "앞·뒷유리 성에 제거", "defrost")}${gnbBtn("seatHot", "운전석 열선", "seat")}</div><div class="gnb-center">${gnbApp("nav", "내비 고정", "fixed")}${gnbApp("music", "음악", "media")}${gnbApp("shop", "스토어", "shop")}${gnbApp("phone", "전화", "phone")}${gnbApp("grid", "앱 목록", "library")}<div class="divider"></div>${gnbApp("roadfm", "ROADFM", "roadfm")}${gnbApp("radio", "최근 앱", "radio")}</div><div class="gnb-side right">${gnbBtn("seatCool", "조수석 통풍", "seat dim")}${gnbBtn("seatHot", "조수석 열선", "seat")}${gnbBtn("chevL", "감소", "chev")}<div class="temp">${sysIcon("fan")}<span class="value"><span class="deg">20<i>.0</i></span><small>${sysIcon("snow")}AUTO</small></span></div>${gnbBtn("chevR", "증가", "chev")}${gnbBtn("airflow", "송풍 방향", "auto-icon")}</div></div><div class="vehicle-mode">${screenMode} · 시뮬레이션</div>${osd}</div>`;
                };
                const layoutButton = document.getElementById("layout");
                layoutButton.onclick = () => {
                    screenMode =
                        screenMode === "Connect-S" ? "Connect-W" : "Connect-S";
                    document.body.classList.toggle(
                        "wide",
                        screenMode === "Connect-W",
                    );
                    layoutButton.textContent = "화면: " + screenMode;
                    show();
                };
                const total = scenes.length;
                let si = 0,
                    fi = 0,
                    timer = null,
                    playing = true,
                    frameStart = 0,
                    frameDur = 0,
                    raf = 0;
                const sceneDur = (s) => s.frames.reduce((a, f) => a + f[0], 0);
                function show() {
                    const sc = scenes[si],
                        [dur, html] = sc.frames[fi];
                    document.body.classList.toggle(
                        "is-driving",
                        html.includes("gear d"),
                    );
                    document.body.classList.toggle(
                        "is-split",
                        html.includes("roadfm-split"),
                    );
                    const el = document.createElement("div");
                    el.className = "scene";
                    el.innerHTML = shell(html, si, fi);
                    stage.appendChild(el);
                    requestAnimationFrame(() => el.classList.add("on"));
                    [...stage.children].slice(0, -1).forEach((o) => {
                        o.classList.remove("on");
                        setTimeout(() => o.remove(), 500);
                    });
                    const t = document.getElementById("tag");
                    t.className = "tag " + (sc.tag[0] || "");
                    t.textContent = sc.tag[1];
                    document.getElementById("stepno").textContent =
                        `${si + 1} / ${total}`;
                    document.getElementById("capTitle").textContent = sc.title;
                    document.getElementById("capText").textContent = sc.text;
                    frameStart = performance.now();
                    frameDur = dur;
                    schedule();
                }
                function schedule() {
                    clearTimeout(timer);
                    if (!playing) return;
                    const left = Math.max(
                        0,
                        frameDur - (performance.now() - frameStart),
                    );
                    timer = setTimeout(advance, left);
                }
                function advance() {
                    const sc = scenes[si];
                    if (fi < sc.frames.length - 1) {
                        fi++;
                    } else if (si < total - 1) {
                        si++;
                        fi = 0;
                    } else {
                        playing = false;
                        updPlay();
                        return;
                    }
                    show();
                }
                function go(i) {
                    si = Math.max(0, Math.min(total - 1, i));
                    fi = 0;
                    show();
                }
                function tick() {
                    const sc = scenes[si];
                    const done =
                        sc.frames.slice(0, fi).reduce((a, f) => a + f[0], 0) +
                        Math.min(
                            frameDur,
                            playing ? performance.now() - frameStart : pausedAt,
                        );
                    document.getElementById("bar").style.width =
                        ((si + done / sceneDur(sc)) / total) * 100 + "%";
                    raf = requestAnimationFrame(tick);
                }
                let pausedAt = 0;
                function updPlay() {
                    document.getElementById("play").textContent = playing
                        ? "❚❚ 일시정지"
                        : "▶ 재생";
                }
                function toggle() {
                    if (playing) {
                        pausedAt = performance.now() - frameStart;
                        playing = false;
                        clearTimeout(timer);
                    } else {
                        playing = true;
                        frameStart = performance.now() - pausedAt;
                        schedule();
                    }
                    updPlay();
                }
                document.getElementById("play").onclick = toggle;
                document.getElementById("prev").onclick = () => go(si - 1);
                document.getElementById("next").onclick = () => go(si + 1);
                document.getElementById("restart").onclick = () => {
                    playing = true;
                    updPlay();
                    go(0);
                };
                addEventListener("keydown", (e) => {
                    if (e.key === " ") {
                        e.preventDefault();
                        toggle();
                    }
                    if (e.key === "ArrowRight") go(si + 1);
                    if (e.key === "ArrowLeft") go(si - 1);
                });
                function fit() {
                    const k = Math.min(innerWidth / 1300, innerHeight / 900);
                    document.documentElement.style.setProperty(
                        "--k",
                        k.toFixed(4),
                    );
                }
                addEventListener("resize", fit);
                fit();
                const q = new URLSearchParams(location.search);
                if (q.has("scene")) {
                    si = Math.min(total - 1, Math.max(0, +q.get("scene") - 1));
                    fi = Math.min(
                        scenes[si].frames.length - 1,
                        +(q.get("frame") || 1) - 1,
                    );
                    if (q.has("still")) {
                        playing = false;
                        updPlay();
                        document.body.classList.add("still");
                    }
                }
                show();
                tick();
            })();
        </script>
